name: Backfill Leads Report (Historical Data)

on:
  workflow_dispatch: # Только ручной запуск из вкладки Actions

jobs:
  run-backfill:
    name: Run Historical Data Backfill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill script
        env:
          BITRIX24_WEBHOOK_URL:       ${{ secrets.BITRIX24_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID:             ${{ secrets.SPREADSHEET_ID }}
          YANDEX_DIRECT_TOKEN:        ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_CLIENT_LOGIN: ${{ secrets.YANDEX_DIRECT_CLIENT_LOGIN }}
        run: python backfill.py
